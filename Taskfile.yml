version: '3'

includes:
  tools: https://github.com/Gildraen/dx-tools/raw/f7b5a41f48026571cafe3e7d287dd0234db9c0b6/taskfiles/base.yml # v0.1.0

env:
  DX_AGENTS_HOME: '{{.ROOT_DIR}}/.devcontainer/components/agents'
  DX_TOOLS_HOME: '{{.ROOT_DIR}}/.devcontainer/components/tools'

tasks:
  default:
    desc: Show available tasks.
    cmds:
      - task --list

  validate:
    desc: Check remote trust and consumer configuration.
    cmds:
      - |
        case ",${TASK_REMOTE_TRUSTED_HOSTS:-}," in
          *,github.com,*) ;;
          *) echo 'github.com must be a trusted Task remote host' >&2; exit 1 ;;
        esac
      - test -f .devcontainer/devcontainer.json
      - test -f .gitmodules
      - test -f AGENTS.md && test -f README.md && test -f renovate.json && test -f .gitignore
      - test -f release-please-config.json && test -f .release-please-manifest.json && test -f version.txt

  lint:
    desc: Validate the agents and tools components.
    cmds:
      - git submodule update --init --recursive
      - task --dir .devcontainer/components/agents validate
      - task --dir .devcontainer/components/tools validate

  test:
    desc: Run the real component suites and the remote tools doctor.
    cmds:
      - task --dir .devcontainer/components/agents test
      - task --dir .devcontainer/components/tools test
      - task tools:doctor
      - bash tests/test-tools-launcher.sh
      - bash tests/test-release-config.sh

  mcp:github:
    desc: Run the GitHub MCP server from the tools component.
    cmds:
      - '"{{.ROOT_DIR}}/.devcontainer/components/tools/bin/dx-mcp" github {{.CLI_ARGS}}'

  fail:
    desc: Return an intentional failure for the negative workflow.
    cmds:
      - 'false'
