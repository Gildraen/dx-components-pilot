version: '3'

includes:
  tools: https://github.com/Gildraen/dx-tools/raw/6630f37ffdc3a8c51af0f4795145a4743a61584b/taskfiles/base.yml # v0.1.0-rc.1

env:
  DX_AGENTS_HOME: '{{.ROOT_DIR}}/.devcontainer/components/agents'
  DX_TOOLS_HOME: '{{.ROOT_DIR}}/.devcontainer/components/tools'
  PATH: '{{.ROOT_DIR}}/.devcontainer/components/tools/bin:{{.PATH}}'

tasks:
  default:
    desc: Show available tasks.
    cmds:
      - task --list

  validate:
    desc: Check remote trust and consumer configuration.
    cmds:
      - |
        case ",${TASK_REMOTE_TRUSTED_HOSTS:-}," in
          *,github.com,*) ;;
          *) echo 'github.com must be a trusted Task remote host' >&2; exit 1 ;;
        esac
      - test -f .devcontainer/devcontainer.json
      - test -f .gitmodules
      - test -f AGENTS.md && test -f README.md && test -f renovate.json

  lint:
    desc: Validate the agents and tools components.
    cmds:
      - git submodule update --init --recursive
      - task --dir .devcontainer/components/agents validate
      - task --dir .devcontainer/components/tools validate

  test:
    desc: Run the real component suites and the remote tools doctor.
    cmds:
      - task --dir .devcontainer/components/agents test
      - task --dir .devcontainer/components/tools test
      - task tools:doctor

  fail:
    desc: Return an intentional failure for the negative workflow.
    cmds:
      - 'false'
