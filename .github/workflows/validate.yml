name: Pilot validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@62f1721ea92ffd7275f4e4e2c60727b486d7def1 # v0.1.0
    secrets: inherit

  lint:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@62f1721ea92ffd7275f4e4e2c60727b486d7def1 # v0.1.0
    with:
      task-name: lint
    secrets: inherit

  release:
    name: Open or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, lint]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@4b4026ff669b5fe8da2aa83e216591bb09e1e8a1 # 0.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
