name: Pilot negative validate

on:
  workflow_dispatch:
    inputs:
      task-name:
        description: Intentional failure scenario
        type: choice
        required: true
        default: fail
        options:
          - fail
          - missing

permissions:
  contents: read

jobs:
  negative:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0
    with:
      task-name: ${{ inputs.task-name }}
    secrets: inherit
