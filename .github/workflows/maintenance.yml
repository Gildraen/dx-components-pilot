name: Pilot maintenance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-links:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-maintenance.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0

  custom-links:
