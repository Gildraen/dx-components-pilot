name: Pilot component integration

on:
  push:
    branches: [feat/component-extraction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and test components outside DX
        env:
          TASK_REMOTE_TRUSTED_HOSTS: github.com
        run: |
          env -u DX_HOME task validate
          env -u DX_HOME task test
