name: Pilot component integration

on:
  push:
    branches: [feat/component-extraction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and test components outside DX
        env:
          TASK_REMOTE_TRUSTED_HOSTS: github.com
        run: |
          env -u DX_HOME task validate
          env -u DX_HOME task test
